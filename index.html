<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TAQA WS Permit Log</title>

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef, useMemo } = React;
    const e = React.createElement;

    // 🔧 Deployed Apps Script URL (used only when the page is hosted statically)
    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbxr4260knjEbE5YUK1Igq9F2un5kq-AtXnxpZxaRCQSn9TgaOHUM8cu2WLV2_gys9Md/exec';

    // ---- Transport: use google.script.run when Apps Script serves this page
    //      (verified identity), otherwise fall back to fetch (static hosting). ----
    const SERVED_BY_GAS = (typeof google !== 'undefined' && google.script && google.script.run);
    function gasCall(fn, arg) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
      });
    }
    async function fetchJson(url, opts) {
      const res = await fetch(url, opts);
      const text = await res.text();
      try { return JSON.parse(text); } catch { throw new Error('Invalid JSON: ' + text); }
    }
    const api = {
      whoami() {
        if (SERVED_BY_GAS) return gasCall('apiWhoami');
        return fetchJson(`${APPS_SCRIPT_URL}?action=whoami`).catch(() => ({ ok: false, email: '', verified: false }));
      },
      list(project) {
        if (SERVED_BY_GAS) return gasCall('apiList', project);
        return fetchJson(`${APPS_SCRIPT_URL}?action=list&project=${encodeURIComponent(project)}`);
      },
      save(payload) {
        if (SERVED_BY_GAS) return gasCall('apiSave', payload);
        const body = new URLSearchParams({ payload: JSON.stringify(payload) }).toString();
        return fetchJson(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body
        });
      }
    };

    // ---- localStorage keys (per-browser) ----
    const LS_LAST_LOGGER = 'permitLog.lastLoggedBy';
    const LS_ROSTER      = 'permitLog.roster.v1';
    const LS_THRESHOLD   = 'permitLog.inactivityDays';
    function lsGet(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : v; } catch { return f; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

    // ---- date helpers ----
    function toDate(val, timeVal) {
      if (!val) return null;
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        const t = (timeVal && /^\d{2}:\d{2}/.test(String(timeVal))) ? String(timeVal).slice(0, 5) : '00:00';
        const d = new Date(s + 'T' + t);
        return isNaN(d.getTime()) ? null : d;
      }
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }
    function startOfWeek(d) { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setHours(0,0,0,0); x.setDate(x.getDate() - day); return x; }
    function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
    function daysSince(d) { return Math.floor((Date.now() - d.getTime()) / 86400000); }
    function fmtDate(d) { if (!d) return '—'; const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), a=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${a}`; }

    function App() {
      const [project, setProject] = useState('TWS O-16123');
      const [permitType, setPermitType] = useState('');
      const [permits, setPermits] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [note, setNote] = useState('');
      const [serverError, setServerError] = useState('');
      const [loading, setLoading] = useState(false);
      const [saving, setSaving] = useState(false);
      const [tab, setTab] = useState('log');
      const [showSettings, setShowSettings] = useState(false);
      const [identity, setIdentity] = useState({ email: '', verified: false, authorized: true, requireVerified: false, restricted: false, checked: false });
      const formRef = useRef(null);
      const toastTimer = useRef(null);

      // Filters
      const [search, setSearch] = useState('');
      const [filterType, setFilterType] = useState('');
      const [filterStatus, setFilterStatus] = useState('');
      const [dateFrom, setDateFrom] = useState('');
      const [dateTo, setDateTo] = useState('');

      // Monitoring config (persisted)
      const [roster, setRoster] = useState(() => {
        try { const a = JSON.parse(lsGet(LS_ROSTER, '[]')); return Array.isArray(a) ? a : []; } catch { return []; }
      });
      const [inactivityDays, setInactivityDays] = useState(() => {
        const n = parseInt(lsGet(LS_THRESHOLD, '3'), 10); return Number.isFinite(n) && n > 0 ? n : 3;
      });
      const [rosterDraft, setRosterDraft] = useState(() => roster.join('\n'));

      const projects = ['TWS O-16123', 'TW O-16124'];
      const permitTypes = [
        { id: 'confined-space', name: 'SOF-3542-I Confined Space Entry' },
        { id: 'excavation',     name: 'SOF-3542-H Excavation' },
        { id: 'work-height',    name: 'SOF-3542-E Work at Height' },
        { id: 'lifting',        name: 'SOF-3542-C Lifting Operation' },
        { id: 'hot-work',       name: 'SOF-3542-B Hot Work Permit' }
      ];

      const [form, setForm] = useState(() => ({
        loggedBy: lsGet(LS_LAST_LOGGER, ''),
        date: new Date().toISOString().split('T')[0],
        time: new Date().toTimeString().slice(0, 5),
        permitNo: '', location: '', contractor: '', supervisor: '',
        workDescription: '', hazards: '', controlMeasures: '', permitIssuer: '',
        validFrom: '', validTo: '', status: 'Active'
      }));
      const [errors, setErrors] = useState({});

      // Identity check on mount
      useEffect(() => {
        api.whoami().then(r => {
          const email = (r && r.email) || '';
          setIdentity({
            email,
            verified: !!email,
            authorized: r && r.authorized !== undefined ? !!r.authorized : true,
            requireVerified: !!(r && r.requireVerified),
            restricted: !!(r && r.restricted),
            checked: true
          });
          if (email) setForm(f => ({ ...f, loggedBy: email }));
        }).catch(() => setIdentity({ email: '', verified: false, authorized: true, requireVerified: false, restricted: false, checked: true }));
      }, []);

      useEffect(() => { loadFromSheet(project); }, [project]);

      function toast(msg) {
        setNote(msg);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setNote(''), 3500);
      }

      async function loadFromSheet(proj) {
        try {
          setServerError(''); setLoading(true);
          const json = await api.list(proj);
          if (!json || !json.ok) throw new Error((json && json.error) || 'load failed');
          const rawRows = json.rows || [];
          const list = rawRows.map((r, i) => ({
            id: `${r['Permit No.'] || r['Permit No'] || 'row'}_${i}_${Date.now()}`,
            project: proj,
            date: r['Date'] || '',
            time: r['Time'] || '',
            permitNo: r['Permit No.'] || r['Permit No'] || r['PermitNo'] || '',
            permitTypeName: r['Permit Type'] || '',
            location: r['Location'] || '',
            contractor: r['Contractor'] || '',
            supervisor: r['Supervisor'] || '',
            workDescription: r['Work Description'] || '',
            hazards: r['Hazards'] || '',
            controlMeasures: r['Control Measures'] || '',
            permitIssuer: r['Permit Issuer'] || '',
            validFrom: r['Valid From'] || '',
            validTo: r['Valid To'] || '',
            status: r['Status'] || 'Active',
            loggedBy: r['Logged By'] || r['LoggedBy'] || r['Recorded By'] || '',
            loggedAt: r['Logged At'] || r['LoggedAt'] || r['Timestamp'] || r['Server Timestamp'] || '',
            verified: String(r['Verified'] || '').toUpperCase() === 'YES'
          }));
          setPermits(list.reverse());
          toast('☁️ Loaded ' + list.length + ' permits');
        } catch (err) {
          setServerError(String(err && err.message ? err.message : err));
          toast('⚠️ Could not load from Google Sheets');
        } finally {
          setLoading(false);
        }
      }

      function updateForm(name, value) {
        setForm(f => ({ ...f, [name]: value }));
        setErrors(s => ({ ...s, [name]: undefined }));
      }

      function validate() {
        const req = ['date', 'time', 'location', 'contractor', 'supervisor'];
        const errs = {};
        if (!permitType) errs.permitType = 'Required';
        // logger: verified email satisfies it; otherwise a typed name is required
        if (!identity.verified && (!form.loggedBy || String(form.loggedBy).trim() === '')) errs.loggedBy = 'Required';
        req.forEach(k => { if (!form[k] || String(form[k]).trim() === '') errs[k] = 'Required'; });
        if (form.validFrom && form.validTo && new Date(form.validTo) < new Date(form.validFrom)) errs.validTo = 'Valid To must be after Valid From';
        setErrors(errs);
        if (Object.keys(errs).length) { formRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return false; }
        return true;
      }

      async function savePermit() {
        // Anti-impersonation gate (mirrors the server; the server is the final authority).
        if (identity.requireVerified && !identity.verified) { toast('❌ Sign-in required — open the app via its Apps Script link and sign in with Google'); return; }
        if (identity.verified && !identity.authorized) { toast('❌ Your account is not on the approved loggers list'); return; }
        if (!validate()) return;
        const permitTypeName = (permitTypes.find(p => p.id === permitType)?.name) || '';
        const loggedBy = identity.verified ? identity.email : String(form.loggedBy).trim();

        if (form.status === 'Active' && form.validTo && new Date(form.validTo) < new Date()) {
          if (!confirm('⚠️ You are saving an ACTIVE permit whose "Valid To" is already in the past. Save anyway?')) return;
        }

        const payload = {
          project, loggedBy, verifiedClaim: identity.verified,
          clientLoggedAt: new Date().toISOString(),
          date: form.date, time: form.time, permitNo: String(form.permitNo).trim(),
          permitTypeName, location: String(form.location).trim(),
          contractor: String(form.contractor).trim(), supervisor: String(form.supervisor).trim(),
          workDescription: String(form.workDescription).trim(), hazards: String(form.hazards).trim(),
          controlMeasures: String(form.controlMeasures).trim(), permitIssuer: String(form.permitIssuer).trim(),
          validFrom: form.validFrom, validTo: form.validTo, status: form.status
        };

        try {
          setSaving(true);
          toast('💾 Saving to Google Sheets…');
          const json = await api.save(payload);
          if (!json || (!json.ok && !json.success)) throw new Error((json && json.error) || 'save failed');
          if (!identity.verified) lsSet(LS_LAST_LOGGER, loggedBy);
          toast(json.verified ? '✅ Saved (verified: ' + (json.loggedBy || loggedBy) + ')' : '✅ Saved to Google Sheets');
          setShowForm(false);
          resetForm(loggedBy);
          await loadFromSheet(project);
        } catch (err) {
          setServerError(String(err && err.message ? err.message : err));
          toast('❌ Save failed (see error below)');
        } finally {
          setSaving(false);
        }
      }

      function resetForm(keepLogger) {
        setErrors({});
        setPermitType('');
        setForm({
          loggedBy: identity.verified ? identity.email : (keepLogger || lsGet(LS_LAST_LOGGER, '')),
          date: new Date().toISOString().split('T')[0],
          time: new Date().toTimeString().slice(0, 5),
          permitNo: '', location: '', contractor: '', supervisor: '',
          workDescription: '', hazards: '', controlMeasures: '', permitIssuer: '',
          validFrom: '', validTo: '', status: 'Active'
        });
      }

      // ---- derived data ----
      function recencyDate(p) { return toDate(p.loggedAt) || toDate(p.date, p.time); }
      function isExpiredActive(p) { const vt = toDate(p.validTo); return (p.status === 'Active') && vt && vt.getTime() < Date.now(); }

      const seenLoggers = useMemo(() => {
        const s = new Set();
        permits.forEach(p => { const n = (p.loggedBy||'').trim(); if (n) s.add(n); });
        roster.forEach(n => { const t=(n||'').trim(); if (t) s.add(t); });
        return Array.from(s).sort();
      }, [permits, roster]);

      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        const from = dateFrom ? toDate(dateFrom) : null;
        const to = dateTo ? toDate(dateTo) : null;
        return permits.filter(p => {
          if (filterType && p.permitTypeName !== filterType) return false;
          if (filterStatus === '__expired' ? !isExpiredActive(p) : (filterStatus && p.status !== filterStatus)) return false;
          if (from || to) {
            const d = toDate(p.date, p.time); if (!d) return false;
            if (from && d < from) return false;
            if (to) { const end = new Date(to); end.setHours(23,59,59,999); if (d > end) return false; }
          }
          if (q) {
            const hay = [p.permitNo,p.permitTypeName,p.location,p.contractor,p.supervisor,p.loggedBy,p.permitIssuer,p.workDescription].join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }, [permits, search, filterType, filterStatus, dateFrom, dateTo]);

      const kpis = useMemo(() => {
        const now = new Date(); const wkStart = startOfWeek(now);
        let active=0, expiredActive=0, today=0, week=0; const loggers = new Set();
        permits.forEach(p => {
          if (p.status === 'Active') active++;
          if (isExpiredActive(p)) expiredActive++;
          const d = recencyDate(p);
          if (d) { if (isSameDay(d, now)) today++; if (d >= wkStart) week++; }
          const n=(p.loggedBy||'').trim(); if (n) loggers.add(n);
        });
        return { total: permits.length, active, expiredActive, today, week, loggers: loggers.size };
      }, [permits]);

      const typeCounts = useMemo(() =>
        permitTypes.map(t => ({ ...t, count: permits.filter(p => p.permitTypeName === t.name).length })), [permits]);

      const loggerStats = useMemo(() => {
        const now = new Date(); const wkStart = startOfWeek(now);
        const map = new Map();
        const ensure = (name) => { if (!map.has(name)) map.set(name, { name, total:0, today:0, week:0, month:0, last:null, verified:0 }); return map.get(name); };
        permits.forEach(p => {
          const name = (p.loggedBy||'').trim() || '— not recorded —';
          const s = ensure(name); s.total++;
          if (p.verified) s.verified++;
          const d = recencyDate(p);
          if (d) {
            if (!s.last || d > s.last) s.last = d;
            if (isSameDay(d, now)) s.today++;
            if (d >= wkStart) s.week++;
            if (d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth()) s.month++;
          }
        });
        roster.forEach(n => { const t=(n||'').trim(); if (t) ensure(t); });
        return Array.from(map.values())
          .map(s => ({ ...s, inactive: !s.last || daysSince(s.last) > inactivityDays }))
          .sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
      }, [permits, roster, inactivityDays]);

      const inactiveCount = loggerStats.filter(s => s.name !== '— not recorded —' && s.inactive).length;

      // ---- CSV ----
      function csvCell(x){ let s = String(x ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g,'""') + '"'; }
      function downloadCSV() {
        if (!filtered.length) { toast('⚠️ Nothing to export with current filters'); return; }
        const headers = ['Date','Time','Permit No.','Permit Type','Location','Contractor','Supervisor','Work Description','Hazards','Control Measures','Permit Issuer','Valid From','Valid To','Status','Logged By','Logged At','Verified'];
        const rows = filtered.map(p => [p.date,p.time,p.permitNo,p.permitTypeName,p.location,p.contractor,p.supervisor,p.workDescription,p.hazards,p.controlMeasures,p.permitIssuer,p.validFrom,p.validTo,p.status,p.loggedBy,p.loggedAt,p.verified?'YES':'NO']);
        const csv = [headers.map(csvCell).join(',')].concat(rows.map(r => r.map(csvCell).join(','))).join('\r\n');
        const url = URL.createObjectURL(new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' }));
        const a = document.createElement('a'); a.href=url; a.download=`Permit_Log_${project}_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      }
      function downloadPerformanceCSV() {
        const headers = ['Logger','Total Permits','Verified Entries','Today','This Week','This Month','Last Logged','Days Inactive','Status'];
        const rows = loggerStats.map(s => [s.name,s.total,s.verified,s.today,s.week,s.month,fmtDate(s.last),s.last?daysSince(s.last):'',s.inactive?'INACTIVE':'Active']);
        const csv = [headers.map(csvCell).join(',')].concat(rows.map(r => r.map(csvCell).join(','))).join('\r\n');
        const url = URL.createObjectURL(new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' }));
        const a = document.createElement('a'); a.href=url; a.download=`Logger_Performance_${project}_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      }

      function saveSettings() {
        const names = rosterDraft.split('\n').map(s => s.trim()).filter(Boolean);
        const uniq = Array.from(new Set(names));
        setRoster(uniq); lsSet(LS_ROSTER, JSON.stringify(uniq));
        const n = parseInt(inactivityDays, 10); const days = Number.isFinite(n) && n > 0 ? n : 3;
        setInactivityDays(days); lsSet(LS_THRESHOLD, String(days));
        setShowSettings(false); toast('✅ Monitoring settings saved (this device)');
      }

      function inputClass(name) {
        return 'w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 ' + (errors[name] ? 'border-red-400' : 'border-gray-300');
      }
      function labeled(label, name, node) {
        return e('div', { className: node && node.props && node.props.className && node.props.className.includes('md:col-span-2') ? 'md:col-span-2' : '' },
          e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, label),
          node,
          errors[name] && e('p', { className: 'text-xs text-red-500 mt-1' }, errors[name])
        );
      }
      function textInput(name, opts = {}) {
        return e('input', { name, type: opts.type || 'text', value: form[name], list: opts.list,
          onChange: ev => updateForm(name, ev.target.value), className: inputClass(name), autoComplete: 'off', placeholder: opts.placeholder || '' });
      }

      const kpiCard = (label, value, tone) =>
        e('div', { key: label, className: `rounded-lg border-2 p-4 ${tone}` },
          e('div', { className: 'text-2xl font-bold text-gray-800' }, value),
          e('div', { className: 'text-xs md:text-sm text-gray-600 mt-1' }, label));

      // Reason the current user is blocked from submitting (empty = allowed).
      const blockedReason = !identity.checked ? '' :
        (identity.requireVerified && !identity.verified)
          ? 'Open the app through its Apps Script link and sign in with your Google account to log permits.' :
        (identity.verified && !identity.authorized)
          ? `You are signed in as ${identity.email}, but this account is not on the approved loggers list. Contact the HSE Manager.` : '';

      // Identity block inside the form
      function identityBlock() {
        if (identity.verified && identity.authorized) {
          return e('div', { className: 'bg-emerald-50 border border-emerald-300 rounded-lg p-4 mb-4' },
            e('label', { className: 'block text-sm font-semibold text-emerald-800 mb-1' }, '👤 Logged By — verified'),
            e('div', { className: 'flex items-center gap-2' },
              e('span', { className: 'text-emerald-600' }, '✅'),
              e('span', { className: 'font-mono text-gray-800' }, identity.email)),
            e('p', { className: 'text-xs text-emerald-700 mt-1' }, 'Signed in with Google. This identity is stamped on the server automatically — it cannot be changed or logged under anyone else’s name.')
          );
        }
        if (identity.verified && !identity.authorized) {
          return e('div', { className: 'bg-rose-50 border border-rose-300 rounded-lg p-4 mb-4' },
            e('label', { className: 'block text-sm font-semibold text-rose-800 mb-1' }, '⛔ Not an approved logger'),
            e('div', { className: 'font-mono text-gray-800' }, identity.email),
            e('p', { className: 'text-xs text-rose-700 mt-1' }, 'This Google account is not on the approved loggers list, so it cannot submit permits. Contact the HSE Manager to be added.')
          );
        }
        if (identity.requireVerified && !identity.verified) {
          return e('div', { className: 'bg-rose-50 border border-rose-300 rounded-lg p-4 mb-4' },
            e('label', { className: 'block text-sm font-semibold text-rose-800 mb-1' }, '⛔ Sign-in required'),
            e('p', { className: 'text-xs text-rose-700 mt-1' }, 'You must open the app through its Apps Script link and sign in with Google before you can log a permit.')
          );
        }
        return e('div', { className: 'bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4' },
          e('label', { className: 'block text-sm font-semibold text-blue-800 mb-1' }, '👤 Logged By (your name) *'),
          e('input', { name: 'loggedBy', type: 'text', value: form.loggedBy, list: 'loggerList',
            onChange: ev => updateForm('loggedBy', ev.target.value), className: inputClass('loggedBy'),
            autoComplete: 'off', placeholder: 'Type your name — recorded against the permit' }),
          e('datalist', { id: 'loggerList' }, seenLoggers.map(n => e('option', { key: n, value: n }))),
          errors.loggedBy && e('p', { className: 'text-xs text-red-500 mt-1' }, errors.loggedBy),
          e('p', { className: 'text-xs text-amber-700 mt-1' },
            '⚠️ Verified Google sign-in is not active on this deployment, so this name is self-declared (not tamper-proof). See CHANGES-AND-SETUP.md to enable it.')
        );
      }

      return e('div', { className: 'min-h-screen p-4 md:p-6' },
        e('div', { className: 'max-w-7xl mx-auto' },

          // Header
          e('div', { className: 'bg-white rounded-lg shadow p-6 mb-4' },
            e('div', { className: 'flex items-center justify-between gap-4 flex-wrap' },
              e('div', null,
                e('h1', { className: 'text-2xl md:text-3xl font-bold text-gray-800' }, 'TAQA WS Contracts Permit Log System'),
                e('p', { className: 'text-xs text-green-600 mt-1' }, '☁️ Connected to Google Sheets · HSE monitoring enabled')
              ),
              e('div', { className: 'flex items-center gap-2' },
                e('button', { onClick: () => setShowSettings(s => !s), className: 'px-3 py-2 border rounded-lg hover:bg-gray-50 text-gray-700' }, '⚙️ Team / Settings'),
                e('button', { onClick: () => { setTab('log'); setShowForm(s => !s); if (!showForm) setErrors({}); },
                  className: 'bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition' }, showForm ? 'Cancel' : '+ New Permit')
              )
            )
          ),

          // Verified sign-in status strip
          identity.checked && (
            blockedReason
              ? e('div', { className: 'bg-rose-50 border border-rose-300 text-rose-800 px-4 py-2 rounded-lg mb-4 text-sm' }, '⛔ ', blockedReason)
              : identity.verified
                ? e('div', { className: 'bg-emerald-50 border border-emerald-300 text-emerald-800 px-4 py-2 rounded-lg mb-4 text-sm flex items-center gap-2 flex-wrap' },
                    e('span', null, '✅'), e('span', null, 'Verified sign-in active — logging as '), e('span', { className: 'font-mono font-semibold' }, identity.email),
                    identity.restricted && e('span', { className: 'text-xs text-emerald-700' }, '· approved-loggers list enforced'))
                : e('div', { className: 'bg-amber-50 border border-amber-300 text-amber-800 px-4 py-2 rounded-lg mb-4 text-sm' },
                    '⚠️ Verified Google sign-in is not active. Entries are recorded under self-declared names until it is enabled (see CHANGES-AND-SETUP.md).')),

          // Settings
          showSettings && e('div', { className: 'bg-white rounded-lg shadow p-6 mb-4 border-l-4 border-blue-500' },
            e('h2', { className: 'text-lg font-bold text-gray-800 mb-1' }, '⚙️ HSE Monitoring Settings'),
            e('p', { className: 'text-xs text-gray-500 mb-4' }, 'Saved in this browser. Add the people who should be logging (names, or their Google emails if using verified sign-in) so the Performance tab can flag anyone who stops.'),
            e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4' },
              e('div', { className: 'md:col-span-2' },
                e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Team roster (one per line)'),
                e('textarea', { rows: 6, value: rosterDraft, onChange: ev => setRosterDraft(ev.target.value),
                  placeholder: 'e.g.\nahmed.ali@company.com\nSara Khan\nJohn Doe',
                  className: 'w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500' })
              ),
              e('div', null,
                e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Flag inactive after (days)'),
                e('input', { type: 'number', min: 1, value: inactivityDays, onChange: ev => setInactivityDays(ev.target.value),
                  className: 'w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500' }),
                e('p', { className: 'text-xs text-gray-500 mt-2' }, 'Roster members with no permit in this many days are highlighted red on the Performance tab.')
              )
            ),
            e('div', { className: 'flex gap-3 justify-end mt-4' },
              e('button', { onClick: () => setShowSettings(false), className: 'px-5 py-2 border border-gray-300 rounded-lg hover:bg-gray-50' }, 'Close'),
              e('button', { onClick: saveSettings, className: 'px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700' }, 'Save settings')
            )
          ),

          // Toolbar
          e('div', { className: 'flex gap-4 items-end flex-wrap mb-4' },
            e('div', null,
              e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Project'),
              e('select', { value: project, onChange: ev => setProject(ev.target.value),
                className: 'border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none' },
                projects.map(p => e('option', { key: p, value: p }, p)))
            ),
            e('div', { className: 'flex-1' }),
            e('button', { onClick: () => loadFromSheet(project), className: 'px-4 py-2 border rounded-lg hover:bg-gray-50' }, loading ? 'Refreshing…' : '🔄 Refresh'),
            e('button', { onClick: downloadCSV, disabled: filtered.length === 0,
              className: 'bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition disabled:bg-gray-300' }, '📥 Export Log CSV')
          ),

          // Toast
          note && e('div', {
            className:
              note.startsWith('✅') ? 'bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg mb-4' :
              note.startsWith('💾') ? 'bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded-lg mb-4' :
              note.startsWith('❌') ? 'bg-rose-100 border border-rose-400 text-rose-700 px-4 py-3 rounded-lg mb-4' :
                                      'bg-amber-100 border border-amber-400 text-amber-800 px-4 py-3 rounded-lg mb-4'
          }, note),
          serverError && e('div', { className: 'bg-rose-50 border border-rose-300 text-rose-700 px-4 py-2 rounded mb-4 text-sm' },
            'Server error: ', e('code', { className: 'break-all' }, serverError)),

          // KPI row
          e('div', { className: 'grid grid-cols-2 md:grid-cols-6 gap-3 mb-4' },
            kpiCard('Total Permits', kpis.total, 'bg-white border-gray-200'),
            kpiCard('Active', kpis.active, 'bg-emerald-50 border-emerald-200'),
            kpiCard('Expired & Active ⚠️', kpis.expiredActive, kpis.expiredActive > 0 ? 'bg-red-50 border-red-300' : 'bg-white border-gray-200'),
            kpiCard('Logged Today', kpis.today, 'bg-blue-50 border-blue-200'),
            kpiCard('This Week', kpis.week, 'bg-indigo-50 border-indigo-200'),
            kpiCard('Active Loggers', kpis.loggers, 'bg-purple-50 border-purple-200')
          ),

          // New Permit form
          showForm && e('div', { ref: formRef, className: 'bg-white rounded-lg shadow p-6 mb-6' },
            e('h2', { className: 'text-xl font-bold text-gray-800 mb-4' }, 'New Permit Entry'),
            identityBlock(),
            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4 mb-4' },
              e('div', null,
                e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Permit Type *'),
                e('select', { name: 'permitType', value: permitType,
                  onChange: ev => { setPermitType(ev.target.value); setErrors(s => ({ ...s, permitType: undefined })); }, className: inputClass('permitType') },
                  e('option', { value: '' }, 'Select Permit Type'),
                  permitTypes.map(t => e('option', { key: t.id, value: t.id }, t.name))),
                errors.permitType && e('p', { className: 'text-xs text-red-500 mt-1' }, errors.permitType)
              ),
              labeled('Date *', 'date', textInput('date', { type: 'date' })),
              labeled('Time *', 'time', textInput('time', { type: 'time' })),
              labeled('Permit No.', 'permitNo', textInput('permitNo')),
              labeled('Location *', 'location', textInput('location')),
              labeled('Contractor *', 'contractor', textInput('contractor')),
              labeled('Supervisor *', 'supervisor', textInput('supervisor')),
              e('div', { className: 'md:col-span-2' },
                e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Work Description'),
                e('textarea', { name: 'workDescription', rows: 2, value: form.workDescription,
                  onChange: ev => updateForm('workDescription', ev.target.value),
                  className: 'w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500', autoComplete: 'off' })),
              e('div', { className: 'md:col-span-2' },
                e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Hazards'),
                e('textarea', { name: 'hazards', rows: 2, value: form.hazards,
                  onChange: ev => updateForm('hazards', ev.target.value),
                  className: 'w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500', autoComplete: 'off' })),
              e('div', { className: 'md:col-span-2' },
                e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Control Measures'),
                e('textarea', { name: 'controlMeasures', rows: 2, value: form.controlMeasures,
                  onChange: ev => updateForm('controlMeasures', ev.target.value),
                  className: 'w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500', autoComplete: 'off' })),
              labeled('Permit Issuer', 'permitIssuer', textInput('permitIssuer')),
              e('div', null,
                e('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Status'),
                e('select', { name: 'status', value: form.status, onChange: ev => updateForm('status', ev.target.value), className: inputClass('status') },
                  e('option', { value: 'Active' }, 'Active'),
                  e('option', { value: 'Closed' }, 'Closed'),
                  e('option', { value: 'Suspended' }, 'Suspended'))),
              labeled('Valid From', 'validFrom', textInput('validFrom', { type: 'datetime-local' })),
              labeled('Valid To', 'validTo', textInput('validTo', { type: 'datetime-local' }))
            ),
            e('div', { className: 'flex gap-3 justify-end' },
              e('button', { onClick: () => { setShowForm(false); resetForm(); }, className: 'px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50' }, 'Cancel'),
              e('button', { onClick: savePermit, disabled: saving || !!blockedReason, title: blockedReason || '',
                className: 'px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed' }, saving ? 'Saving…' : (blockedReason ? 'Cannot submit' : 'Save Permit'))
            )
          ),

          // By-type strip
          e('div', { className: 'grid grid-cols-2 md:grid-cols-5 gap-3 mb-4' },
            typeCounts.map(c =>
              e('div', { key: c.id, className: 'bg-white border rounded-lg p-3' },
                e('div', { className: 'text-xl font-bold text-gray-800' }, c.count),
                e('div', { className: 'text-xs text-gray-500' }, c.name.replace(/^SOF-\S+\s/, ''))))),

          // Tabs
          e('div', { className: 'flex gap-2 mb-4 border-b border-gray-200' },
            e('button', { onClick: () => setTab('log'),
              className: 'px-4 py-2 text-sm font-semibold -mb-px border-b-2 ' + (tab === 'log' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700') }, '📋 Permit Log'),
            e('button', { onClick: () => setTab('performance'),
              className: 'px-4 py-2 text-sm font-semibold -mb-px border-b-2 flex items-center gap-2 ' + (tab === 'performance' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700') },
              '📊 Team Performance', inactiveCount > 0 && e('span', { className: 'bg-red-500 text-white text-xs rounded-full px-2 py-0.5' }, inactiveCount))
          ),

          // TAB: Permit Log
          tab === 'log' && e('div', null,
            e('div', { className: 'bg-white rounded-lg shadow p-4 mb-4 grid grid-cols-1 md:grid-cols-5 gap-3' },
              e('input', { type: 'text', value: search, onChange: ev => setSearch(ev.target.value),
                placeholder: '🔍 Search permit, location, contractor, logger…',
                className: 'md:col-span-2 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500' }),
              e('select', { value: filterType, onChange: ev => setFilterType(ev.target.value), className: 'border border-gray-300 rounded-lg px-3 py-2' },
                e('option', { value: '' }, 'All types'), permitTypes.map(t => e('option', { key: t.id, value: t.name }, t.name))),
              e('select', { value: filterStatus, onChange: ev => setFilterStatus(ev.target.value), className: 'border border-gray-300 rounded-lg px-3 py-2' },
                e('option', { value: '' }, 'All statuses'),
                e('option', { value: 'Active' }, 'Active'),
                e('option', { value: 'Closed' }, 'Closed'),
                e('option', { value: 'Suspended' }, 'Suspended'),
                e('option', { value: '__expired' }, '⚠️ Expired & Active')),
              e('div', { className: 'flex gap-2' },
                e('input', { type: 'date', value: dateFrom, onChange: ev => setDateFrom(ev.target.value), className: 'w-full border border-gray-300 rounded-lg px-2 py-2', title: 'From' }),
                e('input', { type: 'date', value: dateTo, onChange: ev => setDateTo(ev.target.value), className: 'w-full border border-gray-300 rounded-lg px-2 py-2', title: 'To' }))
            ),

            e('div', { className: 'bg-white rounded-lg shadow p-6' },
              e('div', { className: 'flex items-center justify-between mb-4 flex-wrap gap-2' },
                e('h2', { className: 'text-xl font-bold text-gray-800' }, `Permit Log — ${project}`),
                e('span', { className: 'text-sm text-gray-500' }, `Showing ${filtered.length} of ${permits.length}`)),
              filtered.length === 0
                ? e('div', { className: 'text-center py-12 text-gray-500' }, e('p', null, loading ? 'Loading…' : (permits.length ? 'No permits match the current filters.' : 'No data.')))
                : e('div', { className: 'overflow-x-auto' },
                    e('table', { className: 'w-full' },
                      e('thead', { className: 'bg-gray-50' },
                        e('tr', null, ['Date','Time','Permit No.','Type','Location','Contractor','Supervisor','Logged By','Valid To','Status']
                          .map(h => e('th', { key: h, className: 'px-3 py-3 text-left text-xs font-semibold text-gray-700 whitespace-nowrap' }, h)))),
                      e('tbody', { className: 'divide-y divide-gray-200' },
                        filtered.map(p => {
                          const expired = isExpiredActive(p);
                          return e('tr', { key: p.id, className: expired ? 'bg-red-50 hover:bg-red-100' : 'hover:bg-gray-50' },
                            e('td', { className: 'px-3 py-3 text-sm text-gray-800 whitespace-nowrap' }, p.date),
                            e('td', { className: 'px-3 py-3 text-sm text-gray-800 whitespace-nowrap' }, p.time),
                            e('td', { className: 'px-3 py-3 text-sm text-gray-800 whitespace-nowrap' }, p.permitNo || '—'),
                            e('td', { className: 'px-3 py-3 text-sm' }, e('span', { className: 'inline-block px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs' }, p.permitTypeName)),
                            e('td', { className: 'px-3 py-3 text-sm text-gray-800' }, p.location),
                            e('td', { className: 'px-3 py-3 text-sm text-gray-800' }, p.contractor),
                            e('td', { className: 'px-3 py-3 text-sm text-gray-800' }, p.supervisor),
                            e('td', { className: 'px-3 py-3 text-sm whitespace-nowrap' },
                              p.loggedBy
                                ? e('span', { className: 'font-medium text-gray-800 inline-flex items-center gap-1' }, p.verified && e('span', { title: 'Verified Google sign-in' }, '✅'), p.loggedBy)
                                : e('span', { className: 'text-xs text-amber-600 italic' }, 'not recorded')),
                            e('td', { className: 'px-3 py-3 text-sm text-gray-600 whitespace-nowrap' }, p.validTo || '—'),
                            e('td', { className: 'px-3 py-3 text-sm whitespace-nowrap' },
                              expired ? e('span', { className: 'font-semibold text-red-600' }, 'EXPIRED')
                                      : e('span', { className: p.status === 'Active' ? 'font-semibold text-green-600' : 'font-semibold text-gray-500' }, p.status)));
                        }))
                    ))
            )
          ),

          // TAB: Performance
          tab === 'performance' && e('div', null,
            inactiveCount > 0 && e('div', { className: 'bg-red-50 border border-red-300 text-red-800 px-4 py-3 rounded-lg mb-4' },
              `⚠️ ${inactiveCount} team member(s) have not logged a permit in over ${inactivityDays} day(s).`),
            e('div', { className: 'bg-white rounded-lg shadow p-6' },
              e('div', { className: 'flex items-center justify-between mb-4 flex-wrap gap-2' },
                e('h2', { className: 'text-xl font-bold text-gray-800' }, '📊 Logger Performance'),
                e('button', { onClick: downloadPerformanceCSV, className: 'bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm' }, '📥 Export Performance CSV')),
              roster.length === 0 && e('p', { className: 'text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-4' },
                'Tip: add your team in ⚙️ Team / Settings so anyone who has stopped logging is flagged automatically — even before their first permit.'),
              e('div', { className: 'overflow-x-auto' },
                e('table', { className: 'w-full' },
                  e('thead', { className: 'bg-gray-50' },
                    e('tr', null, ['Logger','Total','Verified','Today','This Week','This Month','Last Logged','Status']
                      .map(h => e('th', { key: h, className: 'px-3 py-3 text-left text-xs font-semibold text-gray-700 whitespace-nowrap' }, h)))),
                  e('tbody', { className: 'divide-y divide-gray-200' },
                    loggerStats.map((s, i) => {
                      const notRecorded = s.name === '— not recorded —';
                      const days = s.last ? daysSince(s.last) : null;
                      return e('tr', { key: s.name, className: (s.inactive && !notRecorded) ? 'bg-red-50' : 'hover:bg-gray-50' },
                        e('td', { className: 'px-3 py-3 text-sm font-medium text-gray-800' }, (!notRecorded && i < 3 && s.total > 0 ? ['🥇','🥈','🥉'][i] + ' ' : '') + s.name),
                        e('td', { className: 'px-3 py-3 text-sm font-bold text-gray-800' }, s.total),
                        e('td', { className: 'px-3 py-3 text-sm text-gray-700' }, s.verified > 0 ? `${s.verified} ✅` : (s.total ? '0' : '—')),
                        e('td', { className: 'px-3 py-3 text-sm text-gray-700' }, s.today),
                        e('td', { className: 'px-3 py-3 text-sm text-gray-700' }, s.week),
                        e('td', { className: 'px-3 py-3 text-sm text-gray-700' }, s.month),
                        e('td', { className: 'px-3 py-3 text-sm text-gray-600 whitespace-nowrap' }, s.last ? `${fmtDate(s.last)} (${days === 0 ? 'today' : days + 'd ago'})` : '—'),
                        e('td', { className: 'px-3 py-3 text-sm whitespace-nowrap' },
                          notRecorded ? e('span', { className: 'text-xs text-gray-400' }, 'legacy rows')
                            : (s.inactive ? e('span', { className: 'font-semibold text-red-600' }, s.last ? 'INACTIVE' : 'NEVER LOGGED')
                                          : e('span', { className: 'font-semibold text-green-600' }, 'Active'))));
                    }))
                )),
              e('p', { className: 'text-xs text-gray-400 mt-3' },
                'The Verified column counts entries stamped with a real Google sign-in. Rows saved before this feature appear under "— not recorded —".')
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
